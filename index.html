<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#010203">
<title>开场动画 · 眼睛 → 花瓣 → 圣诞树</title>
<meta name="description" content="字符画眼睛开场 → 瞳孔推进 → WebGL 花瓣/圣诞树粒子界面（手势聚合、场景切换、全屏）。">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="intro is-on" id="intro">
  <!-- ① 字符画眼睛（Canvas 2D，引擎逐字节取自 eyeTutorial 复刻包） -->
  <canvas class="intro-canvas" id="eyeCanvas" aria-hidden="true"></canvas>
  <!-- ② 星轨 + 流星（Canvas 2D，直接画在近黑底上；2026-11-23 删掉了星空照片底图层） -->
  <canvas class="intro-meteor" id="meteorCanvas" aria-hidden="true"></canvas>
  <!-- ③ 花瓣 / 圣诞树（WebGL，透明清屏叠在上面） -->
  <canvas class="intro-particles" id="particleCanvas" aria-hidden="true"></canvas>
  <video class="intro-cam" id="cam" playsinline muted autoplay aria-hidden="true"></video>

  <div class="intro-enter" id="enterHint" aria-hidden="true">点击任意位置重播</div>

  <!-- 融合界面壳：场景切换 / 开启手势 / 全屏（无颜色选择器） -->
  <div class="intro-actions" id="introActions" aria-label="粒子场景操作">
    <div class="intro-scenes" role="group" aria-label="切换场景">
      <button type="button" class="intro-act intro-scene is-active" data-scene="flower" aria-pressed="true">花瓣</button>
      <button type="button" class="intro-act intro-scene" data-scene="lights" aria-pressed="false">圣诞树</button>
    </div>
    <span class="intro-sep" aria-hidden="true"></span>
    <button type="button" class="intro-act" id="introHands" aria-pressed="false">开启手势</button>
    <button type="button" class="intro-act" id="introFullscreen">全屏</button>
  </div>

  <div class="intro-tip" id="introTip" role="status" aria-live="polite"></div>

  <button class="intro-skip" id="introSkip" type="button" aria-label="重新播放">重新播放</button>
</div>

<!-- 眼睛引擎：eyeTutorial 的 Web 复刻版，逐字节复制，勿手改 -->
<script src="./src/engine.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
